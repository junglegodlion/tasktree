<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskTree</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset & Tokens ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Light theme */
  --bg:        #f6f7fb;
  --bg2:       #ffffff;
  --bg3:       #f0f2f8;
  --bg4:       #e8ecf6;
  --border:    rgba(15, 23, 42, 0.08);
  --border2:   rgba(15, 23, 42, 0.14);
  --text:      #0f172a;
  --text2:     rgba(15, 23, 42, 0.72);
  --text3:     rgba(15, 23, 42, 0.45);
  --indigo:    #6366f1;
  --indigo2:   #818cf8;
  --indigo-d:  #4338ca;
  --emerald:   #10b981;
  --emerald2:  #34d399;
  --amber:     #f59e0b;
  --red:       #ef4444;
  --shadow-sm: 0 10px 30px rgba(2,6,23,0.08);
  --shadow-md: 0 24px 80px rgba(2,6,23,0.10);
  --ring:      0 0 0 3px rgba(99,102,241,0.16);
  --radius:    10px;
  --radius-lg: 16px;
  --font-main: 'Noto Sans SC', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --font-display: 'Syne', sans-serif;
}

html[data-theme="dark"] {
  --bg:        #0d0d11;
  --bg2:       #13131a;
  --bg3:       #1a1a24;
  --bg4:       #21212e;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.12);
  --text:      #e8e8f0;
  --text2:     #9a9ab7;
  --text3:     #4a4a6a;
  --shadow-sm: 0 12px 40px rgba(0,0,0,0.35);
  --shadow-md: 0 32px 100px rgba(0,0,0,0.45);
  --ring:      0 0 0 3px rgba(99,102,241,0.28);
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-main); font-size: 14px; line-height: 1.5; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
input, textarea { font-family: inherit; outline: none; }
::selection { background: rgba(99,102,241,0.22); }

/* ── Scrollbar ──────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }

/* ── Layout ─────────────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ── Titlebar ───────────────────────────────────────── */
#titlebar {
  height: 48px; min-height: 48px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  -webkit-app-region: drag;
  user-select: none;
}
#titlebar .logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display); font-weight: 800; font-size: 18px;
  background: linear-gradient(135deg, var(--indigo2), var(--emerald2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}
#titlebar .logo span { font-weight: 400; opacity: 0.5; }
.logo-mark {
  width: 18px; height: 18px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px;
  background: linear-gradient(135deg, rgba(129,140,248,0.18), rgba(52,211,153,0.14));
  border: 1px solid rgba(15,23,42,0.10);
  box-shadow: var(--shadow-sm);
  -webkit-text-fill-color: initial;
}
.logo-mark svg { display:block; }
.win-controls { display: flex; gap: 8px; -webkit-app-region: no-drag; justify-content: flex-end; }
.titlebar-spacer { width: 120px; }
.win-btn {
  width: 34px; height: 28px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.06s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text2);
}
.win-btn svg { width: 12px; height: 12px; display: block; }
.win-btn:hover { background: var(--bg3); border-color: var(--border2); color: var(--text); }
.win-btn:active { transform: scale(0.98); }
.win-btn:focus-visible { box-shadow: var(--ring); }
.win-btn.close:hover { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.22); color: var(--red); }

/* ── Auth Screen ────────────────────────────────────── */
#auth-screen {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
.auth-card {
  width: 380px; padding: 40px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
}
.auth-card h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.auth-card p.sub { color: var(--text2); font-size: 13px; margin-bottom: 28px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px; }
.form-group input {
  width: 100%; padding: 10px 14px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: var(--radius); color: var(--text); font-size: 14px;
  transition: border-color 0.2s;
}
.form-group input:focus { border-color: var(--indigo); box-shadow: var(--ring); }
.btn-primary {
  width: 100%; padding: 11px;
  background: var(--indigo); color: #fff;
  border-radius: var(--radius); font-size: 14px; font-weight: 500;
  transition: background 0.2s, transform 0.1s;
  margin-top: 8px;
}
.btn-primary:hover { background: var(--indigo2); }
.btn-primary:active { transform: scale(0.98); }
.auth-toggle { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text2); }
.auth-toggle a { color: var(--indigo2); cursor: pointer; text-decoration: none; }
.auth-toggle a:hover { text-decoration: underline; }
.auth-error { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 18px; }

/* ── Main Layout ────────────────────────────────────── */
#main-layout { flex: 1; display: flex; overflow: hidden; }

/* ── Sidebar ────────────────────────────────────────── */
#sidebar {
  width: 220px; min-width: 220px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 16px 0;
  overflow-y: auto;
  transition: width 0.2s ease, min-width 0.2s ease, padding 0.2s ease;
}
#sidebar.collapsed {
  width: 56px; min-width: 56px;
  padding: 16px 0;
}
#sidebar.collapsed .sidebar-section,
#sidebar.collapsed .sidebar-label,
#sidebar.collapsed .date-nav-btn .badge,
#sidebar.collapsed .progress-card,
#sidebar.collapsed .sidebar-divider,
#sidebar.collapsed .user-info,
#sidebar.collapsed .logo span,
#sidebar.collapsed #admin-btn {
  display: none;
}
#sidebar.collapsed .date-nav-btn {
  justify-content: center; padding: 8px;
}
#sidebar.collapsed .date-nav-btn .icon { margin: 0; }
#sidebar.collapsed .user-avatar { margin: 0 auto; }
#sidebar.collapsed .logo-mark { margin: 0 auto; }

.sidebar-toggle {
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 8px;
  height: 48px;
  border-radius: 4px;
  background: var(--bg3);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sidebar-toggle::before {
  content: '';
  width: 2px;
  height: 16px;
  border-radius: 1px;
  background: var(--text3);
  transition: all 0.15s;
}
.sidebar-toggle:hover { background: var(--bg4); }
.sidebar-toggle:hover::before { background: var(--text); }
#sidebar.collapsed .sidebar-toggle::before { transform: rotate(90deg); }
.sidebar-section { padding: 0 12px; margin-bottom: 24px; }
.sidebar-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text3); padding: 0 8px; margin-bottom: 6px; font-weight: 600;
}
.date-nav-btn {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; color: var(--text2);
  font-size: 13px; transition: all 0.15s; text-align: left;
}
.date-nav-btn:hover { background: var(--bg3); color: var(--text); }
.date-nav-btn.active { background: rgba(99,102,241,0.12); color: var(--indigo-d); }
.date-nav-btn .icon { width: 18px; text-align: center; font-size: 15px; }
.date-nav-btn .badge {
  margin-left: auto; background: var(--bg4); border-radius: 10px;
  padding: 1px 7px; font-size: 11px; color: var(--text2);
}
.date-nav-btn.active .badge { background: rgba(99,102,241,0.18); color: var(--indigo-d); }

.sidebar-divider { height: 1px; background: var(--border); margin: 8px 12px 16px; }

.user-info {
  margin-top: auto; padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--indigo), var(--emerald));
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.user-name { font-size: 13px; font-weight: 500; flex: 1; }
.user-role { font-size: 11px; color: var(--text2); }
.btn-logout {
  padding: 4px 8px; border-radius: 6px; font-size: 12px;
  color: var(--text3); transition: all 0.15s;
}
.btn-logout:hover { color: var(--red); background: rgba(239,68,68,0.1); }

/* ── Progress Card ───────────────────────────────────── */
.progress-card {
  padding: 16px 12px;
  background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(52,211,153,0.06));
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 8px;
}
.progress-ring {
  display: flex;
  justify-content: center;
  margin-bottom: 16px;
  position: relative;
}
.progress-ring svg {
  width: 100px;
  height: 100px;
  transform: rotate(-90deg);
}
.progress-ring-bg {
  fill: none;
  stroke: var(--border2);
  stroke-width: 3;
}
.progress-ring-fill {
  fill: none;
  stroke: url(#progress-gradient);
  stroke-width: 3;
  stroke-linecap: round;
  transition: stroke-dasharray 0.5s ease;
}
.progress-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.progress-percent {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--indigo), var(--emerald));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.progress-stats {
  display: flex;
  justify-content: space-around;
  gap: 8px;
}
.progress-stat {
  text-align: center;
  flex: 1;
}
.stat-label {
  display: block;
  font-size: 10px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.stat-value {
  display: block;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}

/* ── Main Content ───────────────────────────────────── */
#content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── Content Header ─────────────────────────────────── */
#content-header {
  padding: 20px 28px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.date-display { flex: 1; }
.date-display h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.date-display p { font-size: 13px; color: var(--text2); margin-top: 2px; }
.date-nav-arrows { display: flex; gap: 6px; }
.arrow-btn {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border2);
  background: var(--bg3); color: var(--text2); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.arrow-btn:hover { background: var(--bg4); color: var(--text); border-color: var(--border2); }
.arrow-btn:focus-visible { box-shadow: var(--ring); }

/* ── Task Input ─────────────────────────────────────── */
#task-input-area { padding: 16px 28px; border-bottom: 1px solid var(--border); }
.task-input-wrap {
  display: flex; gap: 10px; align-items: center;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 8px 14px;
  transition: border-color 0.2s;
}
.task-input-wrap:focus-within { border-color: var(--indigo); }
.task-input-wrap .plus-icon { font-size: 18px; color: var(--text3); }
#new-task-input {
  flex: 1; background: none; border: none; color: var(--text);
  font-size: 14px;
}
#new-task-input::placeholder { color: var(--text3); }
.task-hint {
  margin-top: 10px;
  color: var(--text2);
  font-size: 12.5px;
  line-height: 1.45;
  display: flex;
  align-items: center;
  gap: 8px;
}
.task-hint .pill {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(99,102,241,0.10);
  border: 1px solid rgba(99,102,241,0.18);
  color: var(--indigo-d);
}
html[data-theme="dark"] .task-hint .pill {
  background: rgba(99,102,241,0.16);
  border-color: rgba(99,102,241,0.28);
  color: var(--indigo2);
}

/* ── Task List ──────────────────────────────────────── */
#task-list-area { flex: 1; overflow-y: auto; padding: 12px 28px 28px; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 300px; color: var(--text3);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-state p { font-size: 14px; }

/* ── Task Node ──────────────────────────────────────── */
.task-node { position: relative; }
.task-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 8px;
  transition: background 0.15s; cursor: default;
  position: relative; group: true;
}
.task-row:hover { background: rgba(15,23,42,0.04); }
html[data-theme="dark"] .task-row:hover { background: var(--bg2); }
.task-actions {
  display: none; align-items: center; gap: 4px;
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: 3px 6px;
  box-shadow: var(--shadow-sm);
}
.task-row:hover .task-actions { display: flex; }

.task-toggle {
  width: 16px; height: 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text3); font-size: 10px; cursor: pointer;
  border-radius: 4px; transition: all 0.15s;
}
.task-toggle:hover { color: var(--text2); background: var(--bg3); }
.task-toggle.collapsed { opacity: 0.5; }

.task-check {
  width: 18px; height: 18px; flex-shrink: 0;
  border: 2px solid var(--border2); border-radius: 5px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.task-check:hover { border-color: var(--indigo); }
.task-check.checked { background: var(--emerald); border-color: var(--emerald); }
.task-check.partial { background: rgba(99,102,241,0.2); border-color: var(--indigo); }
.task-check .check-icon { display: none; color: #fff; font-size: 11px; font-weight: 700; }
.task-check.checked .check-icon { display: block; }
.task-check.partial .check-icon { display: block; opacity: 0.6; }

.task-label {
  flex: 1; font-size: 13.5px; color: var(--text); min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: text;
}
.task-label.done { text-decoration: line-through; color: var(--text3); }
.task-label[contenteditable="true"] {
  outline: none; white-space: normal; overflow: visible;
  background: transparent;
}

.task-timer-display {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--text2); flex-shrink: 0;
}
.task-timer-display.running { color: var(--emerald2); }
.task-timer-display.urgent { color: var(--amber); animation: pulse 1s infinite; }
.task-timer-display.done { color: var(--emerald); }

.action-btn {
  width: 26px; height: 26px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--text2); transition: all 0.15s;
}
.action-btn:hover { background: var(--bg4); color: var(--text); }
.action-btn:focus-visible { box-shadow: var(--ring); }
.action-btn.run { color: var(--emerald); }
.action-btn.run:hover { background: rgba(16,185,129,0.15); color: var(--emerald2); }
.action-btn.running { color: var(--amber); animation: pulse 1.5s infinite; }
.action-btn.note:hover { background: rgba(245,158,11,0.15); color: var(--amber); }

/* Note Panel */
.task-note-panel {
  display: none;
  padding: 10px 12px 12px 40px;
  background: var(--bg2);
  border-radius: 8px;
  margin: 4px 0 8px;
  border: 1px solid var(--border);
}
.task-note-panel.visible { display: block; }
.task-note-textarea {
  width: 100%;
  min-height: 60px;
  padding: 10px 12px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  resize: vertical;
  font-family: inherit;
}
.task-note-textarea:focus { border-color: var(--indigo); outline: none; box-shadow: var(--ring); }
.task-note-hint { font-size: 11px; color: var(--text3); margin-top: 6px; }

/* Children indent */
.task-children { padding-left: 24px; }

/* ── Timer Panel ────────────────────────────────────── */
#timer-panel {
  border-top: 1px solid var(--border);
  background: var(--bg2);
  padding: 14px 28px;
  display: none; align-items: center; gap: 16px;
}
#timer-panel.visible { display: flex; }
.timer-task-name { flex: 1; font-size: 13px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer-task-name strong { color: var(--text); }
.timer-clock {
  font-family: var(--font-mono); font-size: 28px; font-weight: 500;
  color: var(--text); letter-spacing: 2px;
  min-width: 100px; text-align: center;
}
.timer-clock.running { color: var(--emerald2); }
.timer-clock.urgent { color: var(--amber); }
.timer-controls { display: flex; align-items: center; gap: 8px; }
.timer-step-btn {
  padding: 4px 10px; border-radius: 6px; font-size: 13px;
  background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
  transition: all 0.15s;
}
.timer-step-btn:hover { background: var(--bg4); color: var(--text); }
.timer-step-btn:focus-visible,
.timer-pause-btn:focus-visible,
.timer-stop-btn:focus-visible { box-shadow: var(--ring); }
.timer-pause-btn {
  padding: 6px 18px; border-radius: 8px;
  background: var(--indigo); color: #fff; font-size: 13px; font-weight: 500;
  transition: all 0.15s;
}
.timer-pause-btn:hover { background: var(--indigo2); }
.timer-stop-btn {
  padding: 6px 14px; border-radius: 8px;
  background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
  font-size: 13px; transition: all 0.15s;
}
.timer-stop-btn:hover { background: rgba(239,68,68,0.1); color: var(--red); border-color: var(--red); }
.timer-input { display: none; gap: 6px; margin-top: 10px; align-items: center; }
.timer-input.visible { display: flex; }
#timer-input-field { width: 70px; padding: 6px 8px; border: 1px solid var(--border2); border-radius: 6px; background: var(--bg3); color: var(--text); font-size: 13px; text-align: center; }
#timer-input-field:focus { border-color: var(--indigo); box-shadow: var(--ring); }
.timer-input-confirm, .timer-input-cancel { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; transition: all 0.15s; }
.timer-input-confirm { background: var(--indigo); color: #fff; }
.timer-input-confirm:hover { background: var(--indigo2); }
.timer-input-cancel { background: var(--bg3); color: var(--text2); border: 1px solid var(--border2); }
.timer-input-cancel:hover { background: var(--bg4); color: var(--text); }

/* ── Admin Panel ────────────────────────────────────── */
#admin-btn {
  padding: 6px 10px; border-radius: 6px; font-size: 12px;
  color: var(--text3); transition: all 0.15s; margin-top: 4px; width: 100%;
  text-align: left;
}
#admin-btn:hover { background: var(--bg3); color: var(--text2); }

.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(2,6,23,0.40); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.15s ease;
}
.modal-card {
  width: 480px; max-height: 80vh; overflow-y: auto;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); padding: 28px;
  box-shadow: 0 32px 100px rgba(2,6,23,0.16);
  animation: slideUp 0.2s ease;
}

<script>
// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let DB = { users: [], tasks: [], inviteCodes: [], currentUser: null };
let currentView = 'today';
let currentDateOffset = 0; // days from today
let timerState = {
  taskId: null,
  remaining: 0,
  timerSeconds: 0,
  running: false,
  interval: null,
  pausedAt: null,
  startTime: null
};
let isAuthMode = 'login';
let inlineAddParentId = null;
let currentTheme = 'light';
let sidebarCollapsed = false;
let expandedNoteId = null;
let draggedTaskId = null;

// Drag & Drop
const getAllTaskIds = () => DB.tasks.map(t => t.id);
const isAncestor = (ancestorId, childId) => {
  if (ancestorId === childId) return true;
  const child = DB.tasks.find(t => t.id === childId);
  if (!child || !child.parentId) return false;
  return isAncestor(ancestorId, child.parentId);
};

function handleDragStart(e, taskId) {
  draggedTaskId = taskId;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', taskId);
}

function handleDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.task-row.drag-over, .task-row.drop-allowed, .task-row.drop-forbidden').forEach(el => {
    el.classList.remove('drag-over', 'drop-allowed', 'drop-forbidden');
  });
  draggedTaskId = null;
}

function handleDragOver(e) {
  e.preventDefault();
  const targetRow = e.target.closest('.task-row');
  if (!targetRow || !draggedTaskId) return;
  const targetId = targetRow.closest('.task-node')?.dataset.id;
  if (!targetId || targetId === draggedTaskId) return;
  
  document.querySelectorAll('.task-row.drag-over, .task-row.drop-allowed, .task-row.drop-forbidden, .task-row.drop-reorder-before, .task-row.drop-reorder-after, .task-row.drop-reparent').forEach(el => {
    el.classList.remove('drag-over', 'drop-allowed', 'drop-forbidden', 'drop-reorder-before', 'drop-reorder-after', 'drop-reparent');
  });
  
  if (isAncestor(draggedTaskId, targetId)) {
    targetRow.classList.add('drop-forbidden');
    return;
  }
  
  const rect = targetRow.getBoundingClientRect();
  const offsetX = e.clientX - rect.left;
  const isRightHalf = offsetX > rect.width * 0.4;
  const isLeftHalf = offsetX < rect.width * 0.2;
  
  if (e.ctrlKey || e.metaKey || isRightHalf) {
    targetRow.classList.add('drop-reparent');
  } else if (isLeftHalf) {
    targetRow.classList.add('drop-reorder-before');
  } else {
    targetRow.classList.add('drop-reorder-after');
  }
  targetRow.classList.add('drag-over');
}

function handleDragLeave(e) {
  const targetRow = e.target.closest('.task-row');
  if (targetRow) {
    targetRow.classList.remove('drag-over', 'drop-allowed', 'drop-forbidden');
  }
}

function handleDrop(e, targetTaskId) {
  e.preventDefault();
  const targetRow = e.target.closest('.task-row');
  if (targetRow) {
    targetRow.classList.remove('drag-over', 'drop-allowed', 'drop-forbidden', 'drop-reorder-before', 'drop-reorder-after', 'drop-reparent');
  }
  
  if (!draggedTaskId || !targetTaskId || draggedTaskId === targetTaskId) return;
  if (isAncestor(draggedTaskId, targetTaskId)) return;
  
  const targetTask = DB.tasks.find(t => t.id === targetTaskId);
  if (!targetTask) return;
  
  const rect = targetRow ? targetRow.getBoundingClientRect() : null;
  const offsetX = rect ? e.clientX - rect.left : 0;
  const isRightHalf = rect && offsetX > rect.width * 0.4;
  const isLeftHalf = rect && offsetX < rect.width * 0.2;
  
  if (e.ctrlKey || e.metaKey || isRightHalf) {
    reparentTask(draggedTaskId, targetTaskId);
  } else if (isLeftHalf) {
    reorderTask(draggedTaskId, targetTaskId, 'before');
  } else {
    reorderTask(draggedTaskId, targetTaskId, 'after');
  }
}

async function reorderTask(taskId, targetId, position) {
  const task = DB.tasks.find(t => t.id === taskId);
  const target = DB.tasks.find(t => t.id === targetId);
  if (!task || !target) return;
  
  const targetParentId = target.parentId;
  
  task.parentId = targetParentId;
  
  const siblings = targetParentId 
    ? childrenOf(targetParentId)
    : rootTasksForDate(task.date);
  
  const targetOrder = target.order || 9999;
  
  siblings.forEach(t => {
    if (t.id === taskId) return;
    if (position === 'before') {
      if ((t.order || 0) >= targetOrder && t.id !== taskId) {
        t.order = (t.order || 0) + 1;
      }
    } else {
      if ((t.order || 0) > targetOrder) {
        t.order = (t.order || 0) + 1;
      }
    }
  });
  
  if (position === 'before') {
    task.order = targetOrder - 0.5;
  } else {
    task.order = targetOrder + 0.5;
  }
  
  normalizeOrder(targetParentId, task.date);
  
  await saveDB();
  renderTaskList();
}

async function reparentTask(taskId, newParentId) {
  const task = DB.tasks.find(t => t.id === taskId);
  if (!task) return;
  task.parentId = newParentId;
  normalizeOrder(newParentId, task.date);
  await saveDB();
  renderTaskList();
}

function normalizeOrder(parentId, date) {
  const siblings = parentId 
    ? childrenOf(parentId)
    : DB.tasks.filter(t => t.userId === DB.currentUser && !t.parentId && t.date === date);
  
  siblings.sort((a, b) => (a.order || 0) - (b.order || 0));
  siblings.forEach((t, idx) => {
    t.order = idx + 1;
  });
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

function hashPassword(p) {
  // Simple hash for local app (not cryptographic)
  let h = 5381;
  for (let i = 0; i < p.length; i++) h = ((h << 5) + h) + p.charCodeAt(i);
  return (h >>> 0).toString(16);
}

function dateKey(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

function todayKey() { return dateKey(0); }

function applyTheme(theme) {
  currentTheme = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = currentTheme;
  const iconEl = document.getElementById('theme-toggle-icon');
  const badgeEl = document.getElementById('theme-toggle-badge');
  if (iconEl) iconEl.textContent = currentTheme === 'dark' ? '🌙' : '☀️';
  if (badgeEl) badgeEl.textContent = currentTheme === 'dark' ? '深色' : '浅色';
  try { localStorage.setItem('tasktree_theme', currentTheme); } catch {}
}

function toggleTheme() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed', sidebarCollapsed);
  try { localStorage.setItem('tasktree_sidebar', sidebarCollapsed ? 'collapsed' : 'expanded'); } catch {}
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  const days = ['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}月${d.getDate()}日  周${days[d.getDay()]}`;
}

function fmtTime(sec) {
  const m = Math.floor(Math.abs(sec) / 60).toString().padStart(2,'0');
  const s = (Math.abs(sec) % 60).toString().padStart(2,'0');
  return (sec < 0 ? '-' : '') + m + ':' + s;
}

async function loadDB() {

  if (!DB.tasks)       DB.tasks = [];
  if (!DB.inviteCodes) DB.inviteCodes = [];

    DB.users.push({ id: uid(), username: 'admin', password: hashPassword('admin123'), role: 'admin', createdAt: new Date().toISOString() });
    await saveDB();
  }
}

async function saveDB() { await api.saveData(DB); }

function toggleAuthMode() {
  isAuthMode = isAuthMode === 'login' ? 'register' : 'login';
  const isReg = isAuthMode === 'register';
  document.getElementById('auth-title').textContent = isReg ? '创建账号' : '欢迎回来';
  document.getElementById('auth-sub').textContent = isReg ? '使用邀请码注册' : '登录你的 TaskTree 账号';
  document.getElementById('auth-submit').textContent = isReg ? '注册' : '登录';
  document.getElementById('auth-toggle-text').textContent = isReg ? '已有账号？' : '还没有账号？';
  document.getElementById('auth-toggle-link').textContent = isReg ? '登录' : '注册';
  document.getElementById('invite-group').style.display = isReg ? '' : 'none';
  document.getElementById('auth-error').textContent = '';
}

async function doAuth() {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';

  if (!username || !password) { errEl.textContent = '请填写用户名和密码'; return; }

  if (isAuthMode === 'login') {
    const user = DB.users.find(u => u.username === username && u.password === hashPassword(password));
    if (!user) { errEl.textContent = '用户名或密码错误'; return; }
    DB.currentUser = user.id;
    await saveDB();
    enterApp(user);
  } else {
    const inviteCode = document.getElementById('auth-invite').value.trim();
    if (DB.users.find(u => u.username === username)) { errEl.textContent = '用户名已被使用'; return; }
    // First user is admin, others need invite
    if (DB.users.length > 0) {
      const code = DB.inviteCodes.find(c => c.code === inviteCode && !c.used);
      if (!code) { errEl.textContent = '邀请码无效或已使用'; return; }
      code.used = true; code.usedBy = username;
    }
    const user = { id: uid(), username, password: hashPassword(password), role: 'member', createdAt: new Date().toISOString() };
    DB.users.push(user);
    DB.currentUser = user.id;
    await saveDB();
    enterApp(user);
  }
}

function enterApp(user) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-layout').style.display = 'flex';
  document.getElementById('user-name-display').textContent = user.username;
  document.getElementById('user-avatar').textContent = user.username[0].toUpperCase();
  document.getElementById('user-role-display').textContent = user.role === 'admin' ? '管理员' : '成员';

  renderTaskList();

}

async function logout() {
  stopTimer();
  DB.currentUser = null;
  await saveDB();
  document.getElementById('main-layout').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-password').value = '';
  document.getElementById('auth-error').textContent = '';
}

// ══════════════════════════════════════════════════════════════
//  DATE VIEW
// ══════════════════════════════════════════════════════════════
function setView(view) {
  currentView = view;
  if (view === 'today') currentDateOffset = 0;
  else if (view === 'past') currentDateOffset = -1;
  else if (view === 'future') currentDateOffset = 1;
  ['past','today','future'].forEach(v => {
    document.getElementById('btn-'+v).classList.toggle('active', v === view);
  });
  updateDateDisplay();
  renderTaskList();
}

function offsetDate(delta) {
  if (delta === 0) { currentDateOffset = 0; currentView = 'today'; }
  else currentDateOffset += delta;
  // Auto-set view
  if (currentDateOffset < 0) currentView = 'past';
  else if (currentDateOffset > 0) currentView = 'future';
  else currentView = 'today';
  ['past','today','future'].forEach(v => {
    document.getElementById('btn-'+v).classList.toggle('active', v === currentView);
  });
  updateDateDisplay();
  renderTaskList();
}

function updateDateDisplay() {
  const key = dateKey(currentDateOffset);
  const titles = { '-': '过去', '0': '今天', '+': '未来' };
  let label;
  if (currentDateOffset === 0) label = '今天';
  else if (currentDateOffset === -1) label = '昨天';
  else if (currentDateOffset === 1) label = '明天';
  else label = formatDate(key);
  document.getElementById('date-title').textContent = label;
  document.getElementById('date-sub').textContent = formatDate(key);
}

function updateBadges() {
  const uid = DB.currentUser;
  const today = todayKey();
  const myTasks = DB.tasks.filter(t => t.userId === uid && !t.parentId);
  const past   = myTasks.filter(t => t.date < today).length;
  const todayC = myTasks.filter(t => t.date === today).length;
  const future = myTasks.filter(t => t.date > today).length;
  document.getElementById('badge-past').textContent   = past;
  document.getElementById('badge-today').textContent  = todayC;
  document.getElementById('badge-future').textContent = future;
  updateProgress();
}

// ══════════════════════════════════════════════════════════════
//  TASKS
// ══════════════════════════════════════════════════════════════
function tasksForDate(dateISO) {
  const userId = DB.currentUser;
  if (currentView === 'today') {
    return DB.tasks.filter(t => t.userId === userId && t.date === dateISO);
  } else if (currentView === 'past') {
    const today = todayKey();
    return DB.tasks.filter(t => t.userId === userId && t.date < today);
  } else if (currentView === 'future') {
    const today = todayKey();
    return DB.tasks.filter(t => t.userId === userId && t.date > today);
  }
  return DB.tasks.filter(t => t.userId === userId && t.date === dateISO);
}

function rootTasksForDate(dateISO) {
  const tasks = tasksForDate(dateISO);
  return tasks.filter(t => !t.parentId).sort((a,b) => (a.order || 0) - (b.order || 0));
}

function childrenOf(parentId) {
  return DB.tasks.filter(t => t.parentId === parentId).sort((a,b) => (a.order || 0) - (b.order || 0));
}

async function addTask(text, parentId = null) {
  const date = dateKey(currentDateOffset);
  const siblings = parentId ? childrenOf(parentId) : rootTasksForDate(date);
  const maxOrder = siblings.length > 0 ? Math.max(...siblings.map(t => t.order || 0)) : 0;
  const task = {
    id: uid(), userId: DB.currentUser, date, parentId,
    text, done: false, collapsed: false,
    timerSeconds: 5 * 60, timerUsed: 0, 
    estimatedSeconds: 5 * 60, actualSeconds: 0,
    note: '', isOvertime: false,
    createdAt: new Date().toISOString(),
    order: maxOrder + 1
  };
  DB.tasks.push(task);
  await saveDB();
  updateBadges();
  renderTaskList();
  return task;
}

function beginAddChild(parentId) {
  inlineAddParentId = parentId;
  const parent = DB.tasks.find(t => t.id === parentId);
  if (parent && parent.collapsed) parent.collapsed = false;
  saveDB();
  renderTaskList();
  setTimeout(() => {
    const input = document.querySelector(`input[data-inline-child-for="${parentId}"]`);
    if (input) input.focus();
  }, 0);
}

async function commitInlineChild(parentId, text) {
  const value = (text || '').trim();
  if (!value) return;
  await addTask(value, parentId);
  beginAddChild(parentId);
}

function cancelInlineChild() {
  inlineAddParentId = null;
  renderTaskList();
}

async function deleteTask(taskId) {
  // Delete task and all descendants
  const toDelete = [taskId];
  const collectChildren = (pid) => {
    childrenOf(pid).forEach(c => { toDelete.push(c.id); collectChildren(c.id); });
  };
  collectChildren(taskId);
  DB.tasks = DB.tasks.filter(t => !toDelete.includes(t.id));
  if (timerState.taskId && toDelete.includes(timerState.taskId)) stopTimer();
  if (expandedNoteId && toDelete.includes(expandedNoteId)) expandedNoteId = null;
  await saveDB();
  updateBadges();
  renderTaskList();
}

async function toggleDone(taskId) {
  const task = DB.tasks.find(t => t.id === taskId);
  if (!task) return;
  task.done = !task.done;
  
  // If marking done, also stop timer if running on this task or its children
  if (task.done && timerState.taskId) {
    const isThisTask = timerState.taskId === taskId;
    const collectChildrenIds = (pid) => {
      const ids = [];
      childrenOf(pid).forEach(c => { ids.push(c.id); ids.push(...collectChildrenIds(c.id)); });
      return ids;
    };
    const childIds = collectChildrenIds(taskId);
    if (isThisTask || childIds.includes(timerState.taskId)) {
      stopTimer();
    }
  }
  
  // If marking done, also mark all children done
  const markChildren = (pid, done) => {
    childrenOf(pid).forEach(c => { 
      c.done = done;
      markChildren(c.id, done); 
    });
  };
  markChildren(taskId, task.done);
  await propagateParentStatus(task.parentId);
  await saveDB();
  renderTaskList();
  updateProgress();
}

async function propagateParentStatus(parentId) {
  if (!parentId) return;
  const parent = DB.tasks.find(t => t.id === parentId);
  if (!parent) return;
  const children = childrenOf(parentId);
  if (children.length === 0) return;
  const allDone = children.every(c => c.done);
  parent.done = allDone;
  await propagateParentStatus(parent.parentId);
}

async function renameTask(taskId, newText) {
  const task = DB.tasks.find(t => t.id === taskId);
  if (task) { task.text = newText; await saveDB(); }
}

async function toggleCollapse(taskId) {
  const task = DB.tasks.find(t => t.id === taskId);
  if (task) { task.collapsed = !task.collapsed; await saveDB(); renderTaskList(); }
}

function toggleNotePanel(taskId) {
  if (expandedNoteId === taskId) {
    expandedNoteId = null;
  } else {
    expandedNoteId = taskId;
  }
  renderTaskList();
  if (expandedNoteId) {
    setTimeout(() => {
      const ta = document.querySelector(`#note-panel-${taskId} .task-note-textarea`);
      if (ta) ta.focus();
    }, 0);
  }
}

// ── Check state for task (for partial) ──────────────────────
function taskCheckState(taskId) {
  const children = childrenOf(taskId);
  if (children.length === 0) {
    return DB.tasks.find(t => t.id === taskId)?.done ? 'checked' : '';
  }
  const doneCount = children.filter(c => c.done).length;
  if (doneCount === 0) return '';
  if (doneCount === children.length) return 'checked';
  return 'partial';
}

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════
function renderTaskList() {
  const date = dateKey(currentDateOffset);
  if (inlineAddParentId && !tasksForDate(date).some(t => t.id === inlineAddParentId)) {
    inlineAddParentId = null;
  }
  if (expandedNoteId && !DB.tasks.find(t => t.id === expandedNoteId)) {
    expandedNoteId = null;
  }
  const roots = rootTasksForDate(date);
  const container = document.getElementById('task-list');

  if (roots.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🌱</div>
      <p>今天还没有任务，添加第一个吧</p>
    </div>`;
    updateProgress();
    return;
  }

  container.innerHTML = '';
  roots.forEach(task => container.appendChild(renderNode(task)));
  updateProgress();
}

function renderNode(task) {
  const children = childrenOf(task.id);
  const wantsInlineAdd = inlineAddParentId === task.id;
  const hasChildren = children.length > 0 || wantsInlineAdd;
  const checkState = taskCheckState(task.id);
  const isRunning = timerState.taskId === task.id && timerState.running;
  const hasTimer = task.timerUsed > 0 || isRunning;

  const node = document.createElement('div');
  node.className = 'task-node';
  node.dataset.id = task.id;

  // Row
  const row = document.createElement('div');
  row.className = 'task-row';

  // Toggle
  const toggle = document.createElement('div');
  toggle.className = 'task-toggle' + (task.collapsed ? ' collapsed' : '');
  toggle.innerHTML = hasChildren ? (task.collapsed ? '▶' : '▼') : '&nbsp;';
  if (hasChildren) toggle.onclick = () => toggleCollapse(task.id);
  row.appendChild(toggle);

  // Check
  const check = document.createElement('div');
  check.className = 'task-check ' + checkState;
  check.innerHTML = '<span class="check-icon">' + (checkState === 'partial' ? '−' : '✓') + '</span>';
  check.onclick = () => toggleDone(task.id);
  row.appendChild(check);

  // Label
  const label = document.createElement('div');
  label.className = 'task-label' + (task.done ? ' done' : '');
  
  const labelContent = document.createElement('span');
  labelContent.textContent = task.text;
  labelContent.title = '双击修改任务名称';
  label.appendChild(labelContent);
  
  // Overtime tag
  if (task.isOvertime) {
    const overtimeTag = document.createElement('span');
    overtimeTag.className = 'overtime-tag';
    overtimeTag.textContent = task.done ? '✓曾超时' : '⚠️超时';
    overtimeTag.style.cssText = 'font-size: 10px; padding: 1px 6px; background: ' + (task.done ? 'rgba(16,185,129,0.15)' : 'rgba(245,158,11,0.15)') + '; color: ' + (task.done ? 'var(--emerald)' : 'var(--amber)') + '; border-radius: 4px; margin-left: 8px;';
    label.appendChild(overtimeTag);
  }
  
  label.title = '';
  label.ondblclick = () => startEditLabel(label, task.id);
  row.appendChild(label);

  // Timer display - always show remaining time for tasks with timerSeconds set
  const taskRemaining = task.timerSeconds - task.timerUsed;
  const isThisTask = timerState.taskId === task.id;
  const showTimerDisplay = task.timerSeconds > 0;
  
  if (showTimerDisplay) {
    const displayRemaining = isThisTask ? timerState.remaining : (task.done ? 0 : taskRemaining);
    const td = document.createElement('div');
    td.className = 'task-timer-display' + (isThisTask && isRunning ? ' running' : '') + (displayRemaining > 0 && displayRemaining < 60 ? ' urgent' : '') + (task.done ? ' done' : '');
    td.textContent = task.done ? '完成' : fmtTime(displayRemaining);
    td.style.cursor = 'pointer';
    td.title = task.done ? '任务已完成' : (isThisTask ? '点击暂停' : '点击恢复计时');
    td.onclick = () => {
      if (task.done) return;
      if (isThisTask && isRunning) togglePause();
      else startTimer(task.id);
    };
    row.appendChild(td);
  }

  // Actions
  const actions = document.createElement('div');
  actions.className = 'task-actions';

  // Start/pause timer btn
  const timerBtn = document.createElement('button');
  timerBtn.className = 'action-btn ' + (isRunning ? 'running' : 'run');
  timerBtn.title = isRunning ? '暂停计时' : '开始计时';
  timerBtn.textContent = isRunning ? '⏸' : '▶';
  timerBtn.onclick = () => {
    if (timerState.taskId === task.id) togglePause();
    else startTimer(task.id);
  };
  actions.appendChild(timerBtn);

  // Add child btn
  const addBtn = document.createElement('button');
  addBtn.className = 'action-btn';
  addBtn.title = '添加子任务';
  addBtn.textContent = '＋';
  addBtn.onclick = () => beginAddChild(task.id);
  actions.appendChild(addBtn);

  // Note btn
  const noteBtn = document.createElement('button');
  noteBtn.className = 'action-btn note';
  noteBtn.title = task.note ? '查看/编辑备注' : '添加备注';
  noteBtn.textContent = task.note ? '📝' : '📋';
  noteBtn.onclick = () => toggleNotePanel(task.id);
  actions.appendChild(noteBtn);

  // Delete btn
  const delBtn = document.createElement('button');
  delBtn.className = 'action-btn del';
  delBtn.title = '删除任务';
  delBtn.textContent = '✕';
  delBtn.onclick = () => deleteTask(task.id);
  actions.appendChild(delBtn);

  row.appendChild(actions);

  // Drag events
  row.draggable = true;
  row.addEventListener('dragstart', e => handleDragStart(e, task.id));
  row.addEventListener('dragend', handleDragEnd);
  row.addEventListener('dragover', handleDragOver);
  row.addEventListener('dragleave', handleDragLeave);
  row.addEventListener('drop', e => handleDrop(e, task.id));

  node.appendChild(row);

  // Note panel
  const notePanel = document.createElement('div');
  notePanel.className = 'task-note-panel' + (expandedNoteId === task.id ? ' visible' : '');
  notePanel.id = 'note-panel-' + task.id;
  const noteTextarea = document.createElement('textarea');
  noteTextarea.className = 'task-note-textarea';
  noteTextarea.placeholder = '添加备注...';
  noteTextarea.value = task.note || '';
  noteTextarea.oninput = async (e) => {
    task.note = e.target.value;
    await saveDB();
  };
  noteTextarea.onkeydown = (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      expandedNoteId = null;
      renderTaskList();
    }
  };
  notePanel.appendChild(noteTextarea);
  const noteHint = document.createElement('div');
  noteHint.className = 'task-note-hint';
  noteHint.textContent = '按 Esc 关闭备注面板';
  notePanel.appendChild(noteHint);
  node.appendChild(notePanel);

  // Children
  if (hasChildren && !task.collapsed) {
    const childContainer = document.createElement('div');
    childContainer.className = 'task-children';

    if (wantsInlineAdd) {
      const wrap = document.createElement('div');
      wrap.className = 'task-row';
      wrap.style.background = 'var(--bg2)';
      wrap.style.border = '1px solid var(--border)';
      wrap.style.margin = '6px 0';
      wrap.style.padding = '8px 10px';

      const spacer = document.createElement('div');
      spacer.style.width = '16px';
      wrap.appendChild(spacer);

      const dot = document.createElement('div');
      dot.style.width = '18px';
      dot.style.height = '18px';
      dot.style.borderRadius = '5px';
      dot.style.border = '2px dashed var(--border2)';
      dot.style.opacity = '0.7';
      wrap.appendChild(dot);

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '输入子任务，Enter 创建，Esc 取消…';
      input.dataset.inlineChildFor = task.id;
      input.dataset.inlineCommitted = '0';
      input.style.flex = '1';
      input.style.background = 'transparent';
      input.style.border = 'none';
      input.style.color = 'var(--text)';
      input.style.fontSize = '13.5px';
      input.onkeydown = async (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          cancelInlineChild();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          if (input.dataset.inlineCommitted === '1') return;
          input.dataset.inlineCommitted = '1';
          const v = e.target.value;
          inlineAddParentId = null;
          await commitInlineChild(task.id, v);
          renderTaskList();
        }
      };
      input.onblur = async (e) => {
        if (input.dataset.inlineCommitted === '1') return;
        input.dataset.inlineCommitted = '1';
        const v = e.target.value;
        inlineAddParentId = null;
        if (v && v.trim()) await commitInlineChild(task.id, v);
        renderTaskList();
      };
      wrap.appendChild(input);

      childContainer.appendChild(wrap);
    }

    children.forEach(c => childContainer.appendChild(renderNode(c)));
    node.appendChild(childContainer);
  }

  return node;
}

function startEditLabel(labelEl, taskId) {
  labelEl.contentEditable = 'true';
  labelEl.focus();
  const range = document.createRange();
  range.selectNodeContents(labelEl);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
  const finish = async () => {
    labelEl.contentEditable = 'false';
    const newText = labelEl.textContent.trim();
    if (newText) await renameTask(taskId, newText);
    else renderTaskList();
  };
  labelEl.onblur = finish;
  labelEl.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); labelEl.blur(); } };
}

// 子任务创建改为行内输入框（避免 Electron/Windows 下 prompt 弹窗不可用）

// ══════════════════════════════════════════════════════════════
//  TIMER
// ══════════════════════════════════════════════════════════════
function startTimer(taskId) {
  if (timerState.interval) clearInterval(timerState.interval);

  // Save previous task progress when switching
  if (timerState.taskId && timerState.taskId !== taskId) {
    const prevTask = DB.tasks.find(t => t.id === timerState.taskId);
    if (prevTask) {
      const elapsed = timerState.running 
        ? Math.floor((Date.now() - timerState.startTime) / 1000)
        : timerState.pausedAt || 0;
      prevTask.timerUsed = Math.min(prevTask.timerSeconds, elapsed);
      saveDB();
    }
  }

  const task = DB.tasks.find(t => t.id === taskId);
  if (!task) return;

  const remaining = task.timerSeconds - task.timerUsed;
  timerState = {
    taskId,
    remaining: Math.max(remaining, 0),
    timerSeconds: task.timerSeconds,
    running: true,
    interval: null,
    pausedAt: task.timerUsed,
    startTime: Date.now()
  };
  timerState.interval = setInterval(timerTick, 100);

  updateTimerPanel();
  renderTaskList();
}

function timerTick() {
  if (!timerState.running) return;
  
  const elapsed = Math.floor((Date.now() - timerState.startTime) / 1000);
  timerState.remaining = Math.max(timerState.timerSeconds - timerState.pausedAt - elapsed, 0);

  // Persist every 5s
  const task = DB.tasks.find(t => t.id === timerState.taskId);
  if (task) {
    task.timerUsed = task.timerSeconds - timerState.remaining;
    task.actualSeconds = task.timerUsed;
    if (timerState.remaining % 5 === 0) saveDB();
  }

  updateTimerPanel();

  // Partial re-render timer display inline
  const node = document.querySelector(`.task-node[data-id="${timerState.taskId}"]`);
  if (node) {
    const td = node.querySelector('.task-timer-display');
    if (td) { td.textContent = fmtTime(timerState.remaining); }
  }

  if (timerState.remaining <= 0) {
    onTimerExpired();
  }
}

function togglePause() {
  if (!timerState.taskId) return;
  if (timerState.running) {
    timerState.running = false;
    timerState.pausedAt = (timerState.pausedAt || 0) + Math.floor((Date.now() - timerState.startTime) / 1000);
    clearInterval(timerState.interval);
    document.getElementById('timer-pause-btn').textContent = '继续';
    saveDB();
  } else {
    timerState.running = true;
    timerState.startTime = Date.now();
    timerState.interval = setInterval(timerTick, 100);
    document.getElementById('timer-pause-btn').textContent = '暂停';
  }
}

function stopTimer() {
  if (timerState.taskId) {
    const task = DB.tasks.find(t => t.id === timerState.taskId);
    if (task) {
      const elapsed = timerState.running 
        ? Math.floor((Date.now() - timerState.startTime) / 1000)
        : timerState.pausedAt || 0;
      task.timerUsed = Math.min(task.timerSeconds, elapsed);
      task.actualSeconds = task.timerUsed;
      saveDB();
    }
  }
  clearInterval(timerState.interval);
  timerState = { taskId: null, remaining: 0, timerSeconds: 0, running: false, interval: null, pausedAt: null, startTime: null };
  document.getElementById('timer-panel').classList.remove('visible');
  stopTitleFlash();
  renderTaskList();
}

function adjustTimer(deltaMins) {
  if (!timerState.taskId) return;
  const newSeconds = deltaMins * 60;
  const task = DB.tasks.find(t => t.id === timerState.taskId);
  if (task) {
    // 增加剩余时间
    timerState.remaining += newSeconds;
    if (timerState.remaining < 0) timerState.remaining = 0;
    
    // 增加总时间和预估时间
    task.timerSeconds += newSeconds;
    task.estimatedSeconds = task.timerSeconds;
    if (task.timerSeconds < 60) task.timerSeconds = 60;
    if (task.estimatedSeconds < 60) task.estimatedSeconds = 60;
    if (task.timerSeconds - task.timerUsed < 0) task.timerUsed = 0;
    
    timerState.timerSeconds = task.timerSeconds;
    
    // 调整startTime，保持elapsed不变，使remaining正确
    if (timerState.running) {
      timerState.startTime = Date.now() - ((timerState.timerSeconds - timerState.remaining - (timerState.pausedAt || 0)) * 1000);
    }
    saveDB();
  }
  updateTimerPanel();
}

function showTimeInput() {
  if (!timerState.taskId) return;
  const input = document.getElementById('timer-input');
  const field = document.getElementById('timer-input-field');
  const mins = Math.ceil(Math.max(timerState.remaining / 60, 1));
  field.value = mins;
  field.min = 1;
  field.max = 180;
  input.classList.add('visible');
  field.focus();
  field.select();
}

function hideTimeInput() {
  const input = document.getElementById('timer-input');
  const field = document.getElementById('timer-input-field');
  field.value = '';
  input.classList.remove('visible');
}

function confirmTimerTime() {
  const field = document.getElementById('timer-input-field');
  const mins = parseInt(field.value);
  if (mins >= 1 && mins <= 180 && !isNaN(mins)) {
    const task = DB.tasks.find(t => t.id === timerState.taskId);
    if (task) {
      // Update estimated time only if not set before or still using default
      if (!task.estimatedSeconds || task.estimatedSeconds === 5 * 60) {
        task.estimatedSeconds = mins * 60;
      }
      task.timerSeconds = mins * 60;
      task.timerUsed = 0;
      timerState.remaining = task.timerSeconds;
      timerState.timerSeconds = task.timerSeconds;
      if (timerState.running) {
        timerState.startTime = Date.now();
        timerState.pausedAt = 0;
      } else {
        timerState.pausedAt = 0;
      }
      saveDB();
    } else {
      timerState.remaining = mins * 60;
      timerState.timerSeconds = mins * 60;
    }
    updateTimerPanel();
    hideTimeInput();
  }
}

function handleTimerInputKeypress(event) {
  if (event.key === 'Enter') confirmTimerTime();
  else if (event.key === 'Escape') hideTimeInput();
}

function updateProgress() {
  const todayTasks = tasksForDate(todayKey());
  const completedTasks = todayTasks.filter(t => t.done).length;
  const totalTasks = todayTasks.filter(t => !t.done).length;
  const overtimeTasks = todayTasks.filter(t => t.isOvertime).length;
  const total = totalTasks + completedTasks;
  const percent = total > 0 ? Math.round((completedTasks / total) * 100) : 0;
  
  document.getElementById('progress-percent').textContent = percent + '%';
  document.getElementById('stat-completed').textContent = completedTasks;
  document.getElementById('stat-active').textContent = totalTasks;
  document.getElementById('stat-overtime').textContent = overtimeTasks;
  document.getElementById('stat-total').textContent = total;
  
  const ringFill = document.getElementById('progress-ring-fill');
  ringFill.setAttribute('stroke-dasharray', percent + ', 100');
}

function updateTimerPanel() {
  const panel = document.getElementById('timer-panel');
  if (!timerState.taskId) { panel.classList.remove('visible'); return; }
  panel.classList.add('visible');

  const task = DB.tasks.find(t => t.id === timerState.taskId);
  document.getElementById('timer-task-name-txt').textContent = task?.text || '-';

  const clock = document.getElementById('timer-clock');
  clock.textContent = fmtTime(timerState.remaining);
  clock.className = 'timer-clock' + (timerState.running ? ' running' : '') + (timerState.remaining < 60 && timerState.remaining > 0 ? ' urgent' : '');
  document.getElementById('timer-pause-btn').textContent = timerState.running ? '暂停' : '继续';
  
  // Update estimated and actual time display
  const estimatedEl = document.getElementById('timer-estimated');
  const actualEl = document.getElementById('timer-actual');
  if (task) {
    estimatedEl.textContent = fmtTime(task.estimatedSeconds || task.timerSeconds);
    const actual = task.actualSeconds || task.timerUsed || 0;
    actualEl.textContent = fmtTime(actual);
  } else {
    estimatedEl.textContent = '5分钟';
    actualEl.textContent = '0分钟';
  }
}

// ── Timer Expired ─────────────────────────────────────────────
let flashInterval = null;
let titleFlash = null;

function onTimerExpired() {
  clearInterval(timerState.interval);
  timerState.running = false;

  const task = DB.tasks.find(t => t.id === timerState.taskId);

  // Show timer expired modal
  const modal = document.getElementById('timer-expired-modal');
  document.getElementById('timer-expired-task-name').textContent = `任务「${task?.text || ''}」已完成计时时长`;
  modal.style.display = 'flex';

  // 1. Full-screen green breathe
  const flash = document.getElementById('alert-flash');
  flash.classList.add('active');

  // 2. Title flash
  let alt = true;
  titleFlash = setInterval(() => {
    api.setTitle(alt ? '【⏰ 时间到！】TaskTree' : 'TaskTree');
    alt = !alt;
  }, 600);

  // 3. System notification
  api.notify({ title: '⏰ 时间到！', body: `任务「${task?.text || ''}」计时结束` });

  // 4. Flash window frame (taskbar icon)
  api.flashFrame();

  // 5. Bring window to front and focus
  setTimeout(() => {
    api.focusWindow();
  }, 500);

  updateTimerPanel();
}

function closeTimerExpiredModal() {
  document.getElementById('timer-expired-modal').style.display = 'none';
}

function confirmTimerExpired() {
  const task = DB.tasks.find(t => t.id === timerState.taskId);
  if (task) {
    task.actualSeconds = task.timerUsed;
  }
  closeTimerExpiredModal();
  const flash = document.getElementById('alert-flash');
  flash.classList.remove('active');
  stopTitleFlash();
}

async function delayTimer5Min() {
  const task = DB.tasks.find(t => t.id === timerState.taskId);
  if (!task) return;
  
  // Record actual time used so far before adding delay
  task.actualSeconds = task.timerUsed;
  
  // Mark task as overtime
  if (!task.isOvertime) {
    task.isOvertime = true;
  }
  
  // Add 5 minutes (300 seconds) to the task
  const addSeconds = 5 * 60;
  task.timerSeconds += addSeconds;
  timerState.remaining += addSeconds;
  timerState.timerSeconds = task.timerSeconds;
  
  // Resume the timer
  timerState.running = true;
  timerState.startTime = Date.now();
  timerState.pausedAt = task.timerUsed;
  timerState.interval = setInterval(timerTick, 100);
  
  await saveDB();
  updateTimerPanel();
  renderTaskList();
  updateProgress();
  
  // Close modal
  closeTimerExpiredModal();
  const flash = document.getElementById('alert-flash');
  flash.classList.remove('active');
  stopTitleFlash();
  
  // Notify user
  api.notify({ title: '⏱ 延时5分钟', body: `任务「${task.text}」已延长5分钟，已标记为超时` });
}

function stopTitleFlash() {
  if (titleFlash) { clearInterval(titleFlash); titleFlash = null; }
  api.setTitle('TaskTree');
}

// ══════════════════════════════════════════════════════════════
//  ADMIN
// ══════════════════════════════════════════════════════════════
function showModal(name) {
  if (name === 'admin') {
    renderInviteList();
    renderUserList();
    document.getElementById('admin-modal').style.display = 'flex';
  }
}
function closeModal(name) {
  document.getElementById(name + '-modal').style.display = 'none';
}

function renderInviteList() {
  const el = document.getElementById('invite-list');
  el.innerHTML = '';
  DB.inviteCodes.forEach(c => {
    const div = document.createElement('div');
    div.className = 'invite-code-item';
    div.innerHTML = `<code>${c.code}</code>
      <span class="code-status ${c.used ? 'used' : ''}">${c.used ? '已使用 by '+c.usedBy : '未使用'}</span>`;
    el.appendChild(div);
  });
  if (DB.inviteCodes.length === 0) el.innerHTML = '<p style="color:var(--text3);font-size:13px">暂无邀请码</p>';
}

function renderUserList() {
  const el = document.getElementById('user-list');
  el.innerHTML = '';
  DB.users.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-list-item';
    div.innerHTML = `<div class="user-avatar" style="width:28px;height:28px;font-size:12px">${u.username[0].toUpperCase()}</div>
      <span class="user-list-name">${u.username}</span>
      <span class="user-list-role">${u.role === 'admin' ? '管理员' : '成员'}</span>`;
    el.appendChild(div);
  });
}

async function generateInviteCode() {
  const code = Math.random().toString(36).slice(2, 8).toUpperCase();
  DB.inviteCodes.push({ code, used: false, usedBy: null, createdAt: new Date().toISOString() });
  await saveDB();
  renderInviteList();
}

document.getElementById('auth-toggle-link').onclick = toggleAuthMode;
document.getElementById('auth-submit').onclick = doAuth;
['auth-username','auth-password','auth-invite'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
});

document.getElementById('new-task-input').addEventListener('keydown', async e => {
  if (e.key === 'Enter') {
    const text = e.target.value.trim();
    if (text) { await addTask(text); e.target.value = ''; }
  }
});

// ── Boot ──────────────────────────────────────────────────────
(async function boot() {
  await loadDB();
  // Theme (persisted)
  try {
    const t = localStorage.getItem('tasktree_theme');
    if (t) applyTheme(t);
    else applyTheme('light');
  } catch {
    applyTheme('light');
  }
  // Sidebar state (persisted)
  try {
    const s = localStorage.getItem('tasktree_sidebar');
    if (s === 'collapsed') {
      sidebarCollapsed = true;
      document.getElementById('sidebar').classList.add('collapsed');
    }
  } catch {}
  updateDateDisplay();
  // Auto-login if session exists
  if (DB.currentUser) {
    const user = DB.users.find(u => u.id === DB.currentUser);
    if (user) { enterApp(user); return; }
  }
  document.getElementById('auth-screen').style.display = 'flex';
})();
